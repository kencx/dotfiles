- name: niri
  keybinds:
    - name: terminal
      key: super + Return
    - name: program launcher
      key: super + space
    - name: show windows
      key: super + semicolon
    - name: telegram
      key: super + shift + t
    - name: Wifi
      key: super + shift + c
    - name: Bluetooth
      key: super + shift + b
    - name: Screenshot
      key: super + shift + s
    - name: close window
      key: super + w
    - name: toggle niri overlay
      key: super + o
    - name: exit niri
      key: super + shift + e
    - name: power off monitor
      key: super + ctrl + p

- name: niri (nodes)
  keybinds:
    - name: toggle tiled and floating layout
      key: super + s
    - name: Switch focus tiled and floating node
      key: super + shift + ;
    - name: focus node in direction
      key: super + h,j,k,l
    - name: move node in direction
      key: super + shift + h,j,k,l
    - name: focus {prev, next} node
      key: super + (, )
    - name: focus {first, last} column
      key: super + {g, shift + g}
    - name: move to {first, last} column
      key: alt + {g, shift + g}
    - name: consume/expel window {left, right}
      key: super + {comma , period}
    - name: toggle tabbed column display
      key: super + t

- name: niri (node width)
  keybinds:
    - name: switch preset column width (33%, 50%, 66%)
      key: super + r
    - name: maximize column
      key: super + f
    - name: fullscreen node
      key: super + shift + f
    - name: expand node to remaining space
      key: super + ctrl + f
    - name: center column
      key: super + c
    - name: "{inc, dec} node width"
      key: "super + shift + {minus, equals}"

- name: niri (workspaces)
  keybinds:
    - name: focus {next, prev} workspace
      key: super + [, ]
    - name: focus {n} workspace
      key: super + {n}
    - name: focus last workspace
      key: super + tab
    - name: move node to {n} workspace
      key: super + ctrl + {n}
    - name: reorder workspace {up, down}
      key: super + shift + {i, u}
    - name: move node to {next, prev} workspace
      key: super + ctrl + {j, k}

- name: tmux (copy)
  prefix: ctrl + a
  keybinds:
    - name: Start copy mode
      key: '['
    - name: Start visual selection
      key: ctrl + space
      ignore_prefix: true
    - name: Copy highlighted selection
      key: ctrl + w
      ignore_prefix: true
    - name: Extrakto
      key: 'tab'
    - name: Paste
      key: ']'

- name: tmux (panes)
  prefix: ctrl + a
  keybinds:
    - name: Split pane vertically
      key: '|'
    - name: Split pane horizontally
      key: '-'
    - name: Show pane numbers
      key: q
    - name: Toggle pane zoom
      key: z
    - name: Convert pane into a window
      key: '!'
    - name: Kill current pane
      key: x
    - name: Move pane to the previous pane
      key: '{'
    - name: Move pane to the next pane
      key: '}'
    - name: Toggle between pane layouts
      key: Space
    - name: Resize pane
      key: ctrl + {←,↓,↑,→}

- name: tmux (windows)
  prefix: ctrl + a
  keybinds:
    - name: Create new window
      key: c
    - name: Rename current window
      key: R
    - name: Close current window
      key: '&'
    - name: List windows
      key: w
    - name: Detach from session
      key: d
    - name: Previous window
      key: shift + left
      ignore_prefix: true
    - name: Next window
      key: shift + right
      ignore_prefix: true
    - name: Shift window left
      key: ">"
    - name: Shift window right
      key: "<"

- name: nvim
  prefix: space
  keybinds:
    - name: new tab
      key: "n"
    - name: change pwd to current buffer
      key: cd
    - name: insert markdown link
      key: wl
    - name: colorizer toggle
      key: cc

- name: nvim splits
  prefix: ctrl + w
  keybinds:
    - name: create vertical split
      key: v
    - name: create horizontal split
      key: s
    - name: create empty split
      key: n
    - name: close split
      key: q
    - name: close all other splits
      key: o

- name: nvim telescope
  keybinds:
    - name: Enter insert mode
      key: jk, kk, jj
    - name: Select file as vsplit
      key: ctrl + v
    - name: Select file as new tab
      key: ctrl + t
    - name: Scroll up preview window
      key: ctrl + u
    - name: Scroll down preview window
      key: ctrl + d
    - name: File browser
      key: space + ft
    - name: Find files
      key: space + ff
    - name: Grep current selection
      key: space + fw
    - name: Grep string
      key: space + fg
    - name: Grep current buffer
      key: space + fz
    - name: Buffers
      key: space + fb
    - name: Registers
      key: space + fr
    - name: Diagnostics
      key: space + fd
    - name: LSP document symbols
      key: space + fs
    - name: Git commits
      key: space + gc
    - name: Git buffer commits
      key: space + gbc
    - name: Git status
      key: space + gst

- name: nvim telescope file browser (normal mode)
  keybinds:
    - name: list mappings
      key: '?'
    - name: rename file
      key: r
    - name: create file
      key: c
    - name: go to cwd
      key: w
    - name: change cwd
      key: t
    - name: toggle hidden
      key: h
    - name: toggle files/folders
      key: f
- name: nvim lsp
  keybinds:
    - name: go to defintion
      key: gd
    - name: list references
      key: gr
    - name: hover
      key: K
    - name: rename
      key: space + rn
    - name: code action
      key: space + ca
    - name: next diagnostic
      key: ']d'
    - name: prev diagnostic
      key: '[d'
- name: nvim gitsigns
  keybinds:
    - name: preview hunk
      key: space + hp
    - name: next change
      key: ']c'
    - name: prev change
      key: '[c'
    - name: stage hunk (visual line)
      key: space + sh
    - name: undo stage hunk (visual line)
      key: space + uh
    - name: reset hunk (visual line)
      key: space + rh
    - name: stage buffer
      key: space + sb
    - name: reset buffer
      key: space + rb
- name: nvim Oil
  keybinds:
    - name: Open Oil
      key: :Oil
    - name: Quit
      key: Ctrl + C
    - name: Go to parent directory
      key: "-"
    - name: Go to buffer's $CWD
      key: "_"
    - name: Toggle hidden
      key: "g."
    - name: Show help
      key: "g?"
    - name: Preview selection
      key: Ctrl + p
    - name: Refresh
      key: Ctrl + l
